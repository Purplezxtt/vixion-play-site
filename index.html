<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vixion Play</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=5">
<div class="wrap">
  <header class="top">
    <div class="logo" aria-label="Vixion Play">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="9" style="fill:var(--accent);stroke:none"/><path d="M9 10l7 13 7-13" style="stroke:var(--accent-ink);stroke-width:3"/><circle cx="16" cy="8" r="1.6" style="fill:var(--accent-ink);stroke:none"/></svg>
      <div>Vixion <span>Play</span></div>
    </div>
    <label class="search"><h1 class="vh">Vixion Play</h1><input id="q" type="search" placeholder="Buscar" aria-label="Buscar v&#237;deos"></label>
    <button class="icon-btn" id="theme" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    <button class="icon-btn avb" id="prof" aria-label="Meu canal"></button>
  </header>

  <main>
    <section id="v-videos"><div class="grid" id="grid"></div></section>
    <section id="v-shorts" hidden><div id="shortsbox"></div></section>
    <section id="v-posts" hidden>
      <div class="compose">
        <div id="myavbox"></div>
        <div class="minw" style="flex:1">
          <textarea id="ptxt" maxlength="400" placeholder="O que est&#225; rolando?" aria-label="Escrever post"></textarea>
          <div class="row"><span class="count" id="cnt">280</span><button class="btn" id="pbtn" disabled>Postar</button></div>
        </div>
      </div>
      <div id="posts"></div>
    </section>
    <p class="note">Seus v&#237;deos e posts ficam salvos neste aparelho.</p>
  </main>
</div>

<nav class="nav" aria-label="Principal"><div class="in">
  <button class="tab" data-tab="videos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>V&#237;deos</button>
  <button class="tab" data-tab="shorts"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3"/><path d="M11 9l3 1.8-3 1.8z"/></svg>Shorts</button>
  <button class="plus" id="plus" aria-label="Criar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="posts"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Posts</button>
</div></nav>

<div class="sheet" id="sheet" hidden></div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>window.addEventListener("error",function(e){var d=document.createElement("pre");d.style.cssText="position:fixed;z-index:99;left:0;right:0;top:0;margin:0;background:#400;color:#fff;padding:10px;font-size:12px;white-space:pre-wrap";d.textContent="Erro no site: "+e.message+" (linha "+e.lineno+")";document.body.appendChild(d)})</script>
<script src="app1.js?v=5"></script>
<script src="app2.js?v=5"></script>
</body></html>
