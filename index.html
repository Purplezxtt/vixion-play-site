<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1213">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vixion Play">
<meta name="google" content="notranslate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vixion Play</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --fg:#0F1A1B; --muted:#5B6B6C; --line:#DDE5E4;
  --accent:#0A7C86; --accent-ink:#FFFFFF; --hot:#D9480F; --shadow:0 1px 2px rgba(15,26,27,.06);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0B1213;--surface:#121C1E;--fg:#E8F1F0;--muted:#8FA3A4;--line:#223033;--accent:#35D0C4;--accent-ink:#04201F;--hot:#FF8A4C;--shadow:none;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0B1213;--surface:#121C1E;--fg:#E8F1F0;--muted:#8FA3A4;--line:#223033;--accent:#35D0C4;--accent-ink:#04201F;--hot:#FF8A4C;--shadow:none;color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:900px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:30px;height:30px;flex:none}
.logo span{font-weight:500;color:var(--muted)}
.search{flex:1;min-width:0}
.search input{width:100%;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none;overflow:hidden}
.icon-btn svg{width:19px;height:19px}
.icon-btn .av{width:100%;height:100%;border-radius:0}
.icon-btn.pillb{width:auto;padding:0 14px;border-radius:19px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:440px){.logo span{display:none}}

.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.minw{min-width:0}
.sub{color:var(--muted);font-size:13px}
.sub a:hover{text-decoration:underline}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:20px 16px;padding-top:6px}
.vid{min-width:0}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;max-width:100%;background:var(--line)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.meta{display:flex;gap:10px;padding-top:10px}
.vt{display:block;font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}

.state{margin:36px auto;max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.state .ic{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.state .ic svg{width:30px;height:30px}
.state h2{font-family:var(--font-display);font-size:20px;margin:4px 0 0;color:var(--fg);letter-spacing:-.01em}
.state p{margin:0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.on{background:var(--fg);color:var(--bg)}
.btn.danger{background:transparent;border:1px solid var(--hot);color:var(--hot)}
.btn.block{width:100%}
.btn.sm{padding:7px 14px;font-size:14px}
.btn svg{width:18px;height:18px}
.btn.liked svg{fill:#E0405A;stroke:#E0405A}

.shorts{height:calc(100svh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px;overflow-y:auto;scroll-snap-type:y mandatory;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;border-radius:18px;margin:4px auto 0;max-width:460px}
.shorts::-webkit-scrollbar{display:none}
.short{position:relative;flex:none;height:100%;scroll-snap-align:start;border-radius:18px;overflow:hidden;color:#fff;max-width:100%;background:#000}
.short video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.short::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.68));pointer-events:none}
.tap{position:absolute;inset:0;width:100%;z-index:1}
.pauseflag{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
.short.paused .pauseflag{opacity:1}
.pauseflag span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center}
.pauseflag svg{width:28px;height:28px;fill:#fff;stroke:none}
.sinfo{position:absolute;left:14px;right:84px;bottom:18px;z-index:3;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.sinfo a{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.sinfo .av{width:30px;height:30px;font-size:12px}
.sinfo p{margin:6px 0 0;font-size:14px;overflow-wrap:anywhere}
.rail{position:absolute;right:10px;bottom:18px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.rail .b{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.42);display:grid;place-items:center;backdrop-filter:blur(4px)}
.rail svg{width:22px;height:22px}
.rail .liked svg{fill:#FF5A6E;stroke:#FF5A6E}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);z-index:3}
.prog i{display:block;height:100%;width:0;background:#fff}

.compose{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;margin:6px 0 12px;box-shadow:var(--shadow)}
.compose textarea{width:100%;border:0;background:transparent;color:var(--fg);font:inherit;resize:none;height:56px}
.compose .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--hot);font-weight:700}
.post{display:flex;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line)}
.post .body{flex:1;min-width:0}
.post p{margin:2px 0 8px;overflow-wrap:anywhere;white-space:pre-wrap}
.post .who{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.acts{display:flex;gap:26px;color:var(--muted);font-size:13px}
.acts button{display:flex;align-items:center;gap:6px;padding:4px 0}
.acts svg{width:18px;height:18px}
.acts .liked{color:#E0405A}
.acts .liked svg{fill:#E0405A}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr;align-items:center;gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);padding:4px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.plus{width:50px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.plus svg{width:22px;height:22px}

.sheet,.modal{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sheet{z-index:40}
.modal{z-index:50}
.sheet .in,.modal .in{max-width:820px;margin:0 auto;padding:0 0 28px}
.player{position:relative;aspect-ratio:16/9;background:#000;max-width:100%;overflow:hidden}
.player.tall{aspect-ratio:auto;height:70svh}
.player video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.close{position:absolute;left:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.close svg{width:18px;height:18px}
.sec{padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.sec h2.vtitle{font-family:var(--font-display);font-size:21px;line-height:1.15;margin:14px 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;color:var(--fg)}
.row2{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.row2 .grow{flex:1;min-width:0}
.cm{display:flex;gap:10px;margin:14px 0}
.cm .av{width:32px;height:32px;font-size:12px}
.cm p{margin:0;overflow-wrap:anywhere}
.cm .del{font-size:12px;color:var(--muted);margin-top:2px}
.cin{display:flex;gap:8px;margin-top:8px}
input.txt{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit;width:100%}
textarea.txt{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;font:inherit;resize:vertical;min-height:84px}
.hdr{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px))}
.hdr h2{font-family:var(--font-display);font-size:20px;margin:0;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label,.field .lb{font-weight:700;font-size:14px}
.help{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--hot);font-size:14px;margin:6px 0 0}
.ok{color:var(--accent);font-size:14px;margin:6px 0 0}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:16px;padding:22px 12px;text-align:center;cursor:pointer;background:var(--surface);color:var(--muted);position:relative}
.pick svg{width:30px;height:30px;color:var(--accent)}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.pv{display:flex;gap:12px;align-items:center;margin-top:10px}
.pv img{width:110px;border-radius:10px;aspect-ratio:16/9;object-fit:cover;background:var(--line);max-width:40%}
.pv.v img{width:64px;aspect-ratio:9/16;max-width:25%}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);font-weight:700;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:4px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.tabs2{display:flex;gap:8px;margin:6px 0 4px}
.tabs2 button{flex:1;padding:9px;border-radius:999px;border:1px solid var(--line);font-weight:700;background:var(--surface)}
.tabs2 button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.banner{position:relative;height:120px}
.bigav{width:84px;height:84px;border-radius:50%;border:4px solid var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:34px;color:#fff;overflow:hidden;margin-top:-42px;flex:none}
.bigav img{width:100%;height:100%;object-fit:cover;display:block}
.pavrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;position:relative;z-index:1;flex-wrap:wrap}
.pn{font-family:var(--font-display);font-size:24px;margin:10px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.bio{margin:8px 0;overflow-wrap:anywhere}
.stats{display:flex;gap:22px;margin:12px 0 16px;flex-wrap:wrap}
.stats b{display:block;font-size:19px;font-family:var(--font-display)}
.sec h3.sh{font-family:var(--font-display);font-size:17px;margin:22px 0 10px}
.edav{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.edav .bigav{margin-top:0;border-color:var(--line)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.hrow{display:flex;align-items:center;gap:8px}
.hrow span{font-weight:700;color:var(--muted);font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;max-width:90%;text-align:center}
.confirm{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.spin,.bar i{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#videos" aria-label="Vixion Play">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="9" style="fill:var(--accent);stroke:none"/><path d="M9 10l7 13 7-13" style="stroke:var(--accent-ink);stroke-width:3"/><circle cx="16" cy="8" r="1.6" style="fill:var(--accent-ink);stroke:none"/></svg>
      <div>Vixion <span>Play</span></div>
    </a>
    <label class="search"><h1 class="vh">Vixion Play</h1><input id="q" type="search" placeholder="Buscar" aria-label="Buscar vídeos"></label>
    <button class="icon-btn" id="theme" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    <button class="icon-btn" id="acc" aria-label="Conta"></button>
  </header>
  <main>
    <section id="v-videos"></section>
    <section id="v-shorts" hidden></section>
    <section id="v-posts" hidden></section>
  </main>
</div>

<nav class="nav" aria-label="Principal"><div class="in">
  <a class="tab" data-tab="videos" href="#videos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>Vídeos</a>
  <a class="tab" data-tab="shorts" href="#shorts"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3"/><path d="M11 9l3 1.8-3 1.8z"/></svg>Shorts</a>
  <button class="plus" id="plus" aria-label="Publicar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <a class="tab" data-tab="posts" href="#posts"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Posts</a>
</div></nav>

<div class="sheet" id="sheet" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
var CFG=window.VIXION||{};
var sb=null,ME=null,PROF=null,MYLIKES={},MYSUBS={};
var st={tab:"videos",q:"",muted:true,autoProf:false};
var C={videos:null,shorts:null,posts:null};          // listas em cache
var EXTRA=[];                                         // itens do canal aberto (para curtidas)
var LOADED={videos:0,shorts:0,posts:0};
var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

var ICON={
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9-9.5A5 5 0 0 1 12 7a5 5 0 0 1 9 3.5C19.5 15.4 12 20 12 20z"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 0 1 0 6"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l4 6M21 9l-4 6"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 14v6h14v-6"/></svg>',
  film:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>',
  rect:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3"/><path d="M11 9l3 1.8-3 1.8z"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg>'
};

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){n=n||0;if(n>=1e6)return (n/1e6).toFixed(1).replace(".0","").replace(".",",")+" mi";if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(".0","").replace(".",",")+" mil";return String(n)}
function dur(s){s=Math.round(s||0);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+":"+(m<10?"0":""):"")+m+":"+(r<10?"0":"")+r}
function ago(t){var m=Math.floor((Date.now()-new Date(t).getTime())/60000);if(m<1)return "agora";if(m<60)return "há "+m+" min";var h=Math.floor(m/60);if(h<24)return "há "+h+" h";var d=Math.floor(h/24);if(d<30)return "há "+d+(d===1?" dia":" dias");var mo=Math.floor(d/30);if(mo<12)return "há "+mo+(mo===1?" mês":" meses");var y=Math.floor(mo/12);return "há "+y+(y===1?" ano":" anos")}
function init(n){return String(n||"V").replace("@","").trim().charAt(0).toUpperCase()||"V"}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2400)}
function pub(path){return path?sb.storage.from("media").getPublicUrl(path).data.publicUrl:""}
function pavatar(p){return p&&p.avatar?pub(p.avatar):""}
function avHTML(p,cls){
  p=p||{};
  return '<span class="av '+(cls||"")+'" style="background:hsl('+(+p.hue||180)+' 55% 38%)">'+(p.avatar?'<img alt="" loading="lazy" src="'+esc(pavatar(p))+'">':esc(init(p.name)))+'</span>';
}
function bigAv(p){return '<div class="bigav" style="background:hsl('+(+p.hue||180)+' 55% 38%)">'+(p.avatar?'<img alt="" src="'+esc(pavatar(p))+'">':esc(init(p.name)))+'</div>'}
function shareLink(h){return location.origin+location.pathname+"#"+h}
function copy(text){
  var done=function(){toast("Link copiado")};
  try{navigator.clipboard.writeText(text).then(done,function(){toast(text)})}catch(e){toast(text)}
}
function errMsg(e,fallback){
  var m=(e&&e.message)||"";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Sem conexão com o servidor. Tente de novo.";
  return fallback||"Algo deu errado. Tente de novo.";
}
function stateBlock(icon,title,text,btn){
  return '<div class="state"><div class="ic">'+icon+'</div><h2>'+title+'</h2>'+(text?'<p>'+text+'</p>':'')+(btn||'')+'</div>';
}
function loading(){return '<div class="state"><div class="spin" role="status" aria-label="Carregando"></div></div>'}
function failBlock(retry){return stateBlock(ICON.film,"Não consegui carregar","Confira a internet e tente de novo.",'<button class="btn" data-retry="'+retry+'">Tentar de novo</button>')}

/* ---------- configuração ausente ---------- */
function showSetup(){
  document.querySelector(".top").hidden=true;document.querySelector(".nav").hidden=true;
  $("#v-videos").innerHTML='<div class="state" style="margin-top:80px"><div class="ic">'+ICON.film+'</div><h2>Vixion Play</h2><p>O site ainda não está conectado ao servidor. Falta o arquivo <b>config.js</b> com os dados do Supabase.</p></div>';
}

/* ---------- sessão e perfil ---------- */
function setSession(session){
  ME=session&&session.user?session.user:null;
  if(!ME){PROF=null;MYLIKES={};MYSUBS={};renderAcc();rerender();return}
  Promise.all([
    sb.from("profiles").select("*").eq("id",ME.id).maybeSingle(),
    sb.from("likes").select("target").eq("user_id",ME.id),
    sb.from("subs").select("channel").eq("follower",ME.id)
  ]).then(function(r){
    PROF=r[0].data||null;
    MYLIKES={};(r[1].data||[]).forEach(function(x){MYLIKES[x.target]=1});
    MYSUBS={};(r[2].data||[]).forEach(function(x){MYSUBS[x.channel]=1});
    renderAcc();rerender();
    if(!PROF&&!st.autoProf){st.autoProf=true;openProfileEdit(true)}
    else if(PROF&&PENDING_PUB){PENDING_PUB=false;openPublish()}
  }).catch(function(){renderAcc()});
}
function renderAcc(){
  var b=$("#acc");
  b.classList.toggle("pillb",!ME);
  if(!ME){b.textContent="Entrar";b.setAttribute("aria-label","Entrar")}
  else if(!PROF){b.innerHTML=ICON.user;b.setAttribute("aria-label","Criar canal")}
  else{b.innerHTML=avHTML(PROF);b.setAttribute("aria-label","Meu canal")}
}
function needLogin(msg){
  if(!ME){openAuth(msg||"Entre para continuar.");return false}
  if(!PROF){openProfileEdit(true);return false}
  return true;
}

/* ---------- navegação ---------- */
function setTabUI(t){
  st.tab=t;
  ["videos","shorts","posts"].forEach(function(x){$("#v-"+x).hidden=x!==t});
  document.querySelectorAll(".tab").forEach(function(b){if(b.dataset.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(t!=="shorts")pauseAll();
}
function showTab(t){
  setTabUI(t);
  if(!C[t]||Date.now()-LOADED[t]>60000)loadTab(t);else drawTab(t);
}
function rerender(){drawTab(st.tab);if(!$("#sheet").hidden)refreshSheet()}
function route(){
  var h=location.hash.slice(1),m;
  if((m=h.match(/^v\/(.+)$/))&&UUID.test(m[1])){
    if(!C[st.tab])showTab(st.tab);else setTabUI(st.tab);
    openVideo(m[1]);
  }else if((m=h.match(/^c\/([a-z0-9_.]{3,20})$/))){
    if(!C[st.tab])showTab(st.tab);else setTabUI(st.tab);
    openChannel(m[1]);
  }else{
    closeSheet(true);
    var t=["videos","shorts","posts"].indexOf(h)>-1?h:"videos";
    showTab(t);
  }
}
function goTab(t){if(location.hash==="#"+t)route();else location.hash=t}

/* ---------- consultas ---------- */
var PJOIN="*, profiles!owner(handle,name,hue,avatar)";
function loadTab(t){
  var box=$("#v-"+t);
  if(!C[t])box.innerHTML=loading();
  var q;
  if(t==="posts"){
    q=sb.from("posts").select(PJOIN).order("created_at",{ascending:false}).limit(60);
  }else{
    q=sb.from("videos").select(PJOIN).eq("kind",t==="videos"?"video":"short").order("created_at",{ascending:false}).limit(t==="videos"?60:25);
  }
  return q.then(function(r){
    if(r.error)throw r.error;
    C[t]=r.data||[];LOADED[t]=Date.now();
    if(st.tab===t)drawTab(t);
  }).catch(function(){if(!C[t]&&st.tab===t)box.innerHTML=failBlock(t)});
}
function refresh(t){LOADED[t]=0;if(st.tab===t)loadTab(t)}

/* ---------- desenho das abas ---------- */
function drawTab(t){
  if(!C[t])return;
  if(t==="videos")drawVideos();else if(t==="shorts")drawShorts();else drawPosts();
}
function videoCard(v,opts){
  opts=opts||{};var p=v.profiles||{};
  return '<article class="vid"><a class="thumb" href="#v/'+v.id+'" aria-label="'+esc(v.title)+'"><img alt="" loading="lazy" src="'+esc(pub(v.thumb_path))+'">'+
    (opts.tag&&v.kind==="short"?'<span class="tag">Short</span>':'')+'<span class="dur">'+dur(v.duration)+'</span></a>'+
    '<div class="meta">'+(opts.noav?'':'<a href="#c/'+esc(p.handle)+'" aria-label="Canal '+esc(p.name)+'">'+avHTML(p)+'</a>')+
    '<div class="minw"><a class="vt" href="#v/'+v.id+'">'+esc(v.title)+'</a><div class="sub">'+
    (opts.noav?'':'<a href="#c/'+esc(p.handle)+'">'+esc(p.name)+'</a> · ')+fmt(v.views)+' views · '+ago(v.created_at)+'</div></div></div></article>';
}
function drawVideos(){
  var box=$("#v-videos"),q=st.q.trim().toLowerCase();
  var list=C.videos.filter(function(v){return !q||(v.title+" "+((v.profiles||{}).name||"")+" "+((v.profiles||{}).handle||"")).toLowerCase().indexOf(q)>-1});
  if(!list.length){
    box.innerHTML=q?stateBlock(ICON.film,"Nada encontrado","Tente outra palavra."):
      stateBlock(ICON.film,"Ainda não há vídeos","Seja o primeiro a publicar no Vixion Play.",'<button class="btn" data-publish>Publicar vídeo</button>');
    return;
  }
  box.innerHTML='<div class="grid">'+list.map(function(v){return videoCard(v)}).join("")+'</div>';
}

/* shorts */
var io=null;
function pauseAll(){document.querySelectorAll("#v-shorts video").forEach(function(v){try{v.pause()}catch(e){}})}
function drawShorts(){
  var box=$("#v-shorts");
  if(io){io.disconnect();io=null}
  var list=C.shorts.filter(function(s){var q=st.q.trim().toLowerCase();return !q||s.title.toLowerCase().indexOf(q)>-1});
  if(!list.length){box.innerHTML=stateBlock(ICON.rect,"Ainda não há shorts","Vídeos curtos gravados em pé aparecem aqui, em tela cheia.",'<button class="btn" data-publish>Publicar vídeo</button>');return}
  box.innerHTML='<div class="shorts" id="shorts">'+list.map(function(s){
    var p=s.profiles||{},on=!!MYLIKES[s.id];
    return '<article class="short" data-s="'+s.id+'"><video data-src="'+esc(pub(s.video_path))+'" poster="'+esc(pub(s.thumb_path))+'" loop playsinline preload="none"'+(st.muted?' muted':'')+'></video>'+
    '<button class="tap" data-tap aria-label="Pausar ou continuar"></button><div class="pauseflag"><span>'+ICON.play+'</span></div>'+
    '<div class="sinfo"><a href="#c/'+esc(p.handle)+'">'+avHTML(p)+'<span>@'+esc(p.handle)+'</span></a><p>'+esc(s.title)+'</p></div>'+
    '<div class="rail"><button class="'+(on?"liked":"")+'" data-like="'+s.id+'" data-t="video"><span class="b">'+ICON.heart+'</span><span>'+fmt(s.likes_count)+'</span></button>'+
    '<button data-open="'+s.id+'" aria-label="Comentários"><span class="b">'+ICON.chat+'</span><span>Comentar</span></button>'+
    '<button data-mute><span class="b">'+(st.muted?ICON.mute:ICON.vol)+'</span><span>'+(st.muted?"Mudo":"Som")+'</span></button>'+
    '<button data-share="v/'+s.id+'"><span class="b">'+ICON.share+'</span><span>Enviar</span></button></div>'+
    '<div class="prog"><i></i></div></article>';
  }).join("")+'</div>';
  var root=$("#shorts");
  io=new IntersectionObserver(function(es){es.forEach(function(e){
    var v=e.target.querySelector("video");
    if(e.isIntersecting&&e.intersectionRatio>.7){
      if(!v.src&&v.dataset.src)v.src=v.dataset.src;
      e.target.classList.remove("paused");var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
    }else{try{v.pause()}catch(x){}}
  })},{root:root,threshold:[0,.7,1]});
  root.querySelectorAll(".short").forEach(function(el){
    io.observe(el);
    var v=el.querySelector("video"),bar=el.querySelector(".prog i");
    v.ontimeupdate=function(){if(v.duration)bar.style.width=(v.currentTime/v.duration*100)+"%"};
  });
}

/* posts */
function postHTML(p,opts){
  opts=opts||{};var pr=p.profiles||{},on=!!MYLIKES[p.id],mine=ME&&p.owner===ME.id;
  return '<article class="post">'+(opts.noav?'':'<a href="#c/'+esc(pr.handle)+'">'+avHTML(pr)+'</a>')+'<div class="body"><div class="who">'+
    (opts.noav?'':'<a href="#c/'+esc(pr.handle)+'"><b>'+esc(pr.name)+'</b></a> <span class="sub">@'+esc(pr.handle)+' · </span>')+'<span class="sub">'+ago(p.created_at)+'</span></div>'+
    '<p>'+esc(p.body)+'</p><div class="acts"><button class="'+(on?"liked":"")+'" data-like="'+p.id+'" data-t="post">'+ICON.heart+fmt(p.likes_count)+'</button>'+
    (mine?'<button data-pdel="'+p.id+'" aria-label="Excluir post">'+ICON.trash+'</button>':'')+
    '<button data-share="posts" aria-label="Copiar link">'+ICON.share+'</button></div></div></article>';
}
function drawPosts(){
  var box=$("#v-posts");
  var comp;
  if(ME&&PROF){
    comp='<div class="compose">'+avHTML(PROF)+'<div class="minw" style="flex:1"><textarea id="ptxt" maxlength="400" placeholder="O que está rolando?" aria-label="Escrever post"></textarea>'+
      '<div class="row"><span class="count" id="cnt">280</span><button class="btn sm" id="pbtn" disabled>Postar</button></div></div></div>';
  }else{
    comp='<div class="compose" style="align-items:center;justify-content:space-between"><span class="sub">Entre para escrever posts.</span><button class="btn sm" data-login>Entrar</button></div>';
  }
  var keep=$("#ptxt")?$("#ptxt").value:"";
  box.innerHTML=comp+'<div id="posts">'+(C.posts.length?C.posts.map(function(p){return postHTML(p)}).join(""):stateBlock(ICON.chat,"Ainda não há posts","Escreva o primeiro."))+'</div>';
  var pt=$("#ptxt");if(pt){pt.value=keep;bindCompose();pt.dispatchEvent(new Event("input"))}
}
function bindCompose(){
  var pt=$("#ptxt"),pb=$("#pbtn"),cn=$("#cnt");
  pt.addEventListener("input",function(){var left=280-pt.value.length;cn.textContent=left;cn.classList.toggle("over",left<0);pb.disabled=!pt.value.trim()||left<0});
  pb.addEventListener("click",function(){
    var t=pt.value.trim();if(!t||t.length>280||!needLogin())return;
    pb.disabled=true;
    sb.from("posts").insert({owner:ME.id,body:t}).then(function(r){
      if(r.error){pb.disabled=false;toast("Não consegui postar. Tente de novo.");return}
      pt.value="";toast("Post publicado");refresh("posts");
    });
  });
}

/* ---------- curtir, inscrever, excluir ---------- */
function eachItem(fn){[C.videos,C.shorts,C.posts,EXTRA].forEach(function(l){(l||[]).forEach(fn)});if(VIEWED)fn(VIEWED)}
function toggleLike(id){
  if(!needLogin("Entre para curtir."))return Promise.resolve();
  var on=!!MYLIKES[id];
  function apply(v){
    if(v)MYLIKES[id]=1;else delete MYLIKES[id];
    eachItem(function(x){if(x.id===id)x.likes_count=Math.max(0,(x.likes_count||0)+(v?1:-1))});
    syncLikeUI(id);
  }
  apply(!on);
  var q=on?sb.from("likes").delete().eq("user_id",ME.id).eq("target",id):sb.from("likes").insert({user_id:ME.id,target:id});
  return q.then(function(r){if(r.error){apply(on);toast("Não consegui curtir. Tente de novo.")}});
}
function syncLikeUI(id){
  var on=!!MYLIKES[id],n=0;
  eachItem(function(x){if(x.id===id)n=x.likes_count||0});
  document.querySelectorAll('[data-like="'+id+'"]').forEach(function(b){
    b.classList.toggle("liked",on);
    if(b.classList.contains("btn")){var s=b.querySelector("[data-n]");if(s)s.textContent=fmt(n)}
    else if(b.closest(".rail")){b.querySelector("span:last-child").textContent=fmt(n)}
    else{b.lastChild.textContent=fmt(n)}
  });
}
function toggleSub(chId,btn,after){
  if(!needLogin("Entre para se inscrever."))return;
  var on=!!MYSUBS[chId];
  if(on)delete MYSUBS[chId];else MYSUBS[chId]=1;
  if(btn){btn.textContent=on?"Inscrever-se":"Inscrito";btn.classList.toggle("on",!on)}
  var q=on?sb.from("subs").delete().eq("follower",ME.id).eq("channel",chId):sb.from("subs").insert({follower:ME.id,channel:chId});
  q.then(function(r){
    if(r.error){if(on)MYSUBS[chId]=1;else delete MYSUBS[chId];if(btn){btn.textContent=on?"Inscrito":"Inscrever-se";btn.classList.toggle("on",on)}toast("Não consegui. Tente de novo.");return}
    if(after)after(on?-1:1);
  });
}
var pendDel=null;
function confirmDel(key,btn,label,fn){
  if(pendDel&&pendDel.key===key){clearTimeout(pendDel.t);pendDel=null;fn();return}
  if(pendDel)clearTimeout(pendDel.t);
  var old=btn?btn.textContent:"";
  if(btn&&label)btn.textContent="Toque de novo para excluir";
  pendDel={key:key,t:setTimeout(function(){pendDel=null;if(btn&&label)btn.textContent=old},3500)};
  if(!label)toast("Toque de novo para excluir");
}
function deleteVideo(v){
  var paths=[v.video_path];if(v.thumb_path)paths.push(v.thumb_path);
  sb.from("videos").delete().eq("id",v.id).then(function(r){
    if(r.error){toast("Não consegui excluir.");return}
    sb.storage.from("media").remove(paths);
    C.videos=null;C.shorts=null;LOADED.videos=0;LOADED.shorts=0;
    toast("Vídeo excluído");
    location.hash=st.tab;
  });
}

/* ---------- janelas ---------- */
function closeSheet(silent){
  var sh=$("#sheet"),v=sh.querySelector("video");if(v)try{v.pause()}catch(e){}
  sh.hidden=true;sh.innerHTML="";SHEET=null;VIEWED=null;EXTRA=[];
  if(!silent){/* o hash decide */}
  document.body.style.overflow=$("#modal").hidden?"":"hidden";
}
function closeModal(){var m=$("#modal");m.hidden=true;m.innerHTML="";document.body.style.overflow=$("#sheet").hidden?"":"hidden"}
var SHEET=null,VIEWED=null;
function refreshSheet(){
  if(!SHEET)return;
  if(SHEET.type==="channel")openChannel(SHEET.handle,true);
  else if(SHEET.type==="video"&&VIEWED){
    syncLikeUI(VIEWED.id);
    var sbb=$("#sb");if(sbb){var on=!!MYSUBS[VIEWED.owner];sbb.textContent=on?"Inscrito":"Inscrever-se";sbb.classList.toggle("on",on)}
    loadComments(VIEWED.id);
  }
}
function closeBtnGo(){location.hash=st.tab}

/* ----- player ----- */
var VIEWS={};
function openVideo(id,silent){
  var sh=$("#sheet");
  if(SHEET&&SHEET.type==="video"&&SHEET.id===id&&!sh.hidden)return;
  pauseAll();
  SHEET={type:"video",id:id};
  sh.innerHTML='<div class="in"><div class="player"><button class="close" data-close aria-label="Fechar">'+ICON.x+'</button></div><div class="sec">'+loading()+'</div></div>';
  sh.hidden=false;sh.scrollTop=0;document.body.style.overflow="hidden";
  sb.from("videos").select(PJOIN).eq("id",id).maybeSingle().then(function(r){
    if(!SHEET||SHEET.id!==id)return;
    if(r.error||!r.data){
      sh.innerHTML='<div class="in"><div class="hdr"><button class="icon-btn" data-close aria-label="Voltar">'+ICON.back+'</button><h2>Vídeo</h2></div><div class="sec">'+stateBlock(ICON.film,r.error?"Não consegui carregar":"Vídeo não encontrado",r.error?"Confira a internet.":"Ele pode ter sido excluído.")+'</div></div>';
      return;
    }
    VIEWED=r.data;drawVideoSheet();
    if(!VIEWS[id]){VIEWS[id]=1;sb.rpc("add_view",{vid:id}).then(function(){})}
  });
}
function drawVideoSheet(){
  var v=VIEWED,sh=$("#sheet"),p=v.profiles||{},on=!!MYLIKES[v.id],mine=ME&&v.owner===ME.id,isSub=!!MYSUBS[v.owner];
  var short=v.kind==="short";
  sh.innerHTML='<div class="in"><div class="player'+(short?' tall':'')+'"><video controls playsinline autoplay poster="'+esc(pub(v.thumb_path))+'" src="'+esc(pub(v.video_path))+'"></video>'+
   '<button class="close" data-close aria-label="Fechar">'+ICON.x+'</button></div>'+
   '<div class="sec"><h2 class="vtitle">'+esc(v.title)+'</h2><div class="sub">'+fmt(v.views)+' views · '+ago(v.created_at)+'</div>'+
   '<div class="row2"><a href="#c/'+esc(p.handle)+'">'+avHTML(p)+'</a><div class="grow"><a href="#c/'+esc(p.handle)+'"><b>'+esc(p.name)+'</b></a><div class="sub">@'+esc(p.handle)+'</div></div>'+
   (mine?'':'<button class="btn sm'+(isSub?' on':'')+'" id="sb">'+(isSub?'Inscrito':'Inscrever-se')+'</button>')+'</div>'+
   '<div class="row2"><button class="btn ghost sm'+(on?' liked':'')+'" data-like="'+v.id+'" data-t="video">'+ICON.heart+'<span data-n>'+fmt(v.likes_count)+'</span></button>'+
   '<button class="btn ghost sm" data-share="v/'+v.id+'">'+ICON.share+'Compartilhar</button>'+
   (mine?'<button class="btn danger sm" id="dl">Excluir vídeo</button>':'')+'</div>'+
   (v.description?'<p class="desc">'+esc(v.description)+'</p>':'')+
   '<h3 class="sh" id="chead">Comentários</h3><div id="cms">'+loading()+'</div>'+
   '<form class="cin" id="cf"><input class="txt" id="ci" placeholder="Adicionar comentário" aria-label="Comentário" maxlength="200" autocomplete="off"><button class="btn" type="submit">Enviar</button></form></div></div>';
  var sbb=$("#sb",sh);if(sbb)sbb.onclick=function(){toggleSub(v.owner,sbb)};
  var dl=$("#dl",sh);if(dl)dl.onclick=function(){confirmDel("v"+v.id,dl,true,function(){deleteVideo(v)})};
  $("#cf",sh).onsubmit=function(e){
    e.preventDefault();var i=$("#ci",sh),t=i.value.trim();if(!t||!needLogin("Entre para comentar."))return;
    i.disabled=true;
    sb.from("comments").insert({video_id:v.id,owner:ME.id,body:t}).then(function(r){
      i.disabled=false;
      if(r.error){toast("Não consegui comentar.");return}
      i.value="";loadComments(v.id);
    });
  };
  loadComments(v.id);
}
function loadComments(id){
  sb.from("comments").select(PJOIN.replace("*","id,owner,body,created_at")).eq("video_id",id).order("created_at",{ascending:false}).limit(100).then(function(r){
    var box=$("#cms");if(!box||!VIEWED||VIEWED.id!==id)return;
    if(r.error){box.innerHTML='<p class="sub">Não consegui carregar os comentários.</p>';return}
    var list=r.data||[];
    $("#chead").textContent="Comentários"+(list.length?" ("+list.length+")":"");
    box.innerHTML=list.length?list.map(function(c){
      var pr=c.profiles||{},mine=ME&&c.owner===ME.id;
      return '<div class="cm"><a href="#c/'+esc(pr.handle)+'">'+avHTML(pr)+'</a><div class="minw"><div class="sub"><a href="#c/'+esc(pr.handle)+'">@'+esc(pr.handle)+'</a> · '+ago(c.created_at)+'</div><p>'+esc(c.body)+'</p>'+
        (mine?'<button class="del" data-cdel="'+c.id+'">Excluir</button>':'')+'</div></div>';
    }).join(""):'<p class="sub" style="margin:8px 0">Seja o primeiro a comentar.</p>';
  });
}

/* ----- canal ----- */
function openChannel(handle,keep){
  var sh=$("#sheet");
  if(!keep&&SHEET&&SHEET.type==="channel"&&SHEET.handle===handle&&!sh.hidden)return;
  pauseAll();

var MAXMB=50;

var MIME={mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime","3gp":"video/3gpp",mkv:"video/x-matroska",m4v:"video/x-m4v"};
function probe(file){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),v=document.createElement("video"),done=false;
  v.muted=true;v.playsInline=true;v.preload="metadata";
  function fail(){if(done)return;done=true;URL.revokeObjectURL(u);rej()}
  var to=setTimeout(fail,15000);
  v.onerror=fail;
  v.onloadedmetadata=function(){try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(e){}};
  v.onseeked=function(){
    if(done)return;done=true;clearTimeout(to);
    var w=v.videoWidth,h=v.videoHeight,c=document.createElement("canvas"),sc=Math.min(1,640/Math.max(w,h));
    c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    var d=v.duration;
    try{c.getContext("2d").drawImage(v,0,0,c.width,c.height)}catch(e){}
    c.toBlob(function(b){URL.revokeObjectURL(u);res({thumb:b,thumbUrl:c.toDataURL("image/jpeg",.72),dur:d,vertical:h>w})},"image/jpeg",.78);
  };
  v.src=u;
})}

    return}
  if(t.dataset.cdel){var cid=t.dataset.cdel;confirmDel("c"+cid,t,true,function(){
    sb.from("comments").delete().eq("id",cid).then(function(r){if(r.error){toast("Não consegui excluir.");return}if(VIEWED)loadComments(VIEWED.id)})});return}
  if(t.hasAttribute("data-mute")){st.muted=!st.muted;document.querySelectorAll("#v-shorts video").forEach(function(v){v.muted=st.muted});
    document.querySelectorAll("[data-mute]").forEach(function(b){b.innerHTML='<span class="b">'+(st.muted?ICON.mute:ICON.vol)+'</span><span>'+(st.muted?"Mudo":"Som")+'</span>'});return}
  if(t.hasAttribute("data-tap")){var sh=t.closest(".short"),v=sh.querySelector("video");
    if(v.paused){var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});sh.classList.remove("paused")}else{v.pause();sh.classList.add("paused")}return}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(!$("#modal").hidden)closeModal();else if(!$("#sheet").hidden)closeBtnGo()}});
var qt=null;
$("#q").addEventListener("input",function(){
  st.q=this.value;
  if(st.tab==="posts")goTab("videos");
  clearTimeout(qt);qt=setTimeout(function(){if(location.hash.match(/^#(v|c)\//))location.hash=st.tab;drawTab(st.tab)},150);
});
$("#theme").addEventListener("click",function(){
  var r=document.documentElement,cur=r.getAttribute("data-theme");
  if(!cur)cur=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
});
$("#plus").addEventListener("click",openPublish);
$("#acc").addEventListener("click",function(){
  if(!ME)openAuth();else if(!PROF)openProfileEdit(true);else location.hash="c/"+PROF.handle;
});
window.addEventListener("hashchange",route);

/* ---------- início ---------- */
if(!CFG.url||!CFG.key||!window.supabase){showSetup();return}
sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
renderAcc();
sb.auth.onAuthStateChange(function(ev,session){
  var uid=session&&session.user?session.user.id:null;
  if(ev==="TOKEN_REFRESHED"||(ev==="SIGNED_IN"&&uid&&ME&&ME.id===uid)){if(session)ME=session.user;return}
  setTimeout(function(){setSession(session)},0);
});
route();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
