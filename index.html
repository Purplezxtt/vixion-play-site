<title>Vixion Play</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: app de uma coluna no celular. Barra superior fixa (logo, busca, tema), 3 abas (Vídeos, Shorts, Posts) na barra inferior com botão central de criar. Player de vídeo abre em folha sobre a tela. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --fg:#0F1A1B; --muted:#5B6B6C; --line:#DDE5E4;
  --accent:#0A7C86; --accent-ink:#FFFFFF; --hot:#E8590C; --shadow:0 1px 2px rgba(15,26,27,.06);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0B1213;--surface:#121C1E;--fg:#E8F1F0;--muted:#8FA3A4;--line:#223033;--accent:#35D0C4;--accent-ink:#04201F;--hot:#FF8A4C;--shadow:none;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0B1213;--surface:#121C1E;--fg:#E8F1F0;--muted:#8FA3A4;--line:#223033;--accent:#35D0C4;--accent-ink:#04201F;--hot:#FF8A4C;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:30px;height:30px;flex:none}
.logo span{font-weight:500;color:var(--muted)}
.search{flex:1;min-width:0}
.search input{width:100%;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn svg{width:19px;height:19px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* vídeos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px 16px}
.vid{display:block;text-align:left;width:100%}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;max-width:100%}
.art{position:absolute;inset:0;background:
  radial-gradient(circle at 20% 30%,hsl(calc(var(--h) + 60) 90% 70% / .55),transparent 45%),
  radial-gradient(circle at 80% 80%,hsl(calc(var(--h) - 40) 90% 35% / .8),transparent 55%),
  linear-gradient(135deg,hsl(var(--h) 75% 48%),hsl(calc(var(--h) + 45) 70% 26%))}
.thumb .t{position:absolute;left:12px;bottom:10px;right:56px;font-family:var(--font-display);font-weight:800;font-size:clamp(18px,5vw,26px);line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35);letter-spacing:-.02em}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.meta{display:flex;gap:10px;padding-top:10px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;background:hsl(var(--h) 55% 40%)}
.meta h3{margin:0;font-size:15px;font-weight:700;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.minw{min-width:0}

/* shorts */
.shorts{height:calc(100svh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px;overflow-y:auto;scroll-snap-type:y mandatory;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;border-radius:18px}
.shorts::-webkit-scrollbar{display:none}
.short{position:relative;flex:none;height:100%;scroll-snap-align:start;border-radius:18px;overflow:hidden;color:#fff;max-width:100%}
.short .art{background-size:100% 100%,100% 100%,100% 100%;animation:drift 9s ease-in-out infinite alternate}
.short.paused .art,.short.paused .prog i{animation-play-state:paused}
@keyframes drift{from{filter:hue-rotate(0deg) saturate(1)}to{filter:hue-rotate(50deg) saturate(1.3)}}
.short::after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.tap{position:absolute;inset:0;width:100%;z-index:1}
.pauseflag{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
.short.paused .pauseflag{opacity:1}
.pauseflag span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center}
.pauseflag svg{width:28px;height:28px;fill:#fff;stroke:none}
.sinfo{position:absolute;left:14px;right:80px;bottom:18px;z-index:3;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.sinfo b{display:block;font-size:16px}
.sinfo p{margin:4px 0 6px;font-size:14px}
.sinfo small{opacity:.9;font-size:12px}
.rail{position:absolute;right:10px;bottom:18px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.rail .b{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;backdrop-filter:blur(4px)}
.rail svg{width:22px;height:22px}
.rail .liked svg{fill:#FF5A6E;stroke:#FF5A6E}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);z-index:3}
.prog i{display:block;height:100%;width:0;background:#fff;animation:fill 14s linear infinite}
@keyframes fill{to{width:100%}}

/* posts */
.compose{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;margin-bottom:12px;box-shadow:var(--shadow)}
.compose textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;resize:none;height:56px}
.compose .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--hot);font-weight:700}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:8px 18px;border-radius:999px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.on{background:var(--fg);color:var(--bg)}
.post{display:flex;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line)}
.post .body{flex:1;min-width:0}
.post p{margin:2px 0 8px;overflow-wrap:anywhere}
.post .who b{font-weight:700}
.post .who span{color:var(--muted);font-size:14px}
.pmini{height:92px;border-radius:12px;margin-bottom:8px;position:relative;overflow:hidden}
.acts{display:flex;justify-content:space-between;max-width:340px;color:var(--muted);font-size:13px}
.acts button{display:flex;align-items:center;gap:6px;padding:4px 0}
.acts svg{width:18px;height:18px}
.acts .liked{color:#E0405A}
.acts .liked svg{fill:#E0405A}

/* nav inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr;align-items:center;gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);padding:4px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.plus{width:50px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.plus svg{width:22px;height:22px}

/* player */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:760px;margin:0 auto;padding:0 0 24px}
.player{position:relative;aspect-ratio:16/9;background:#000;max-width:100%;overflow:hidden}
.player .art{animation:drift 9s ease-in-out infinite alternate}
.player.paused .art{animation-play-state:paused}
.pbar{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;align-items:center;gap:10px;color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.pbar .track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.pbar .track i{display:block;height:100%;width:0;background:#fff}
.pbar button{color:#fff;display:grid;place-items:center}
.pbar svg{width:20px;height:20px;fill:#fff;stroke:none}
.close{position:absolute;left:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.close svg{width:18px;height:18px}
.sec{padding:0 max(16px,env(safe-area-inset-left,0px))}
.sec h2{font-family:var(--font-display);font-size:21px;line-height:1.15;margin:14px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.row2{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.row2 .grow{flex:1;min-width:0}
.cm{display:flex;gap:10px;margin:12px 0}
.cm p{margin:0;overflow-wrap:anywhere}
.cin{display:flex;gap:8px;margin-top:8px}
.cin input{flex:1;min-width:0;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;max-width:90%}
.note{color:var(--muted);font-size:13px;text-align:center;margin:20px 0 0}
.empty{color:var(--muted);text-align:center;padding:32px 0}
h1.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.art,.prog i{animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo" aria-label="Vixion Play">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="9" style="fill:var(--accent);stroke:none"/><path d="M9 10l7 13 7-13" style="stroke:var(--accent-ink);stroke-width:3"/><circle cx="16" cy="8" r="1.6" style="fill:var(--accent-ink);stroke:none"/></svg>
      <div>Vixion <span>Play</span></div>
    </div>
    <label class="search"><h1 class="vh">Vixion Play</h1><input id="q" type="search" placeholder="Buscar" aria-label="Buscar vídeos"></label>
    <button class="icon-btn" id="theme" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
  </header>

  <main>
    <section id="v-videos">
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>
    <section id="v-shorts" hidden><div class="shorts" id="shorts"></div></section>
    <section id="v-posts" hidden>
      <div class="compose">
        <div class="av" style="--h:180">V</div>
        <div class="minw" style="flex:1">
          <textarea id="ptxt" maxlength="400" placeholder="O que está rolando?" aria-label="Escrever post"></textarea>
          <div class="row"><span class="count" id="cnt">280</span><button class="btn" id="pbtn" disabled>Postar</button></div>
        </div>
      </div>
      <div id="posts"></div>
    </section>
    <p class="note">Protótipo com vídeos e posts de exemplo.</p>
  </main>
</div>

<nav class="nav" aria-label="Principal"><div class="in">
  <button class="tab" data-tab="videos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>Vídeos</button>
  <button class="tab" data-tab="shorts"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3"/><path d="M11 9l3 1.8-3 1.8z"/></svg>Shorts</button>
  <button class="plus" id="plus" aria-label="Criar post"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="posts"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Posts</button>
</div></nav>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var ICON={
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9-9.5A5 5 0 0 1 12 7a5 5 0 0 1 9 3.5C19.5 15.4 12 20 12 20z"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg>',
  repost:'<svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M3 11V9a2 2 0 0 1 2-2h16M7 21l-4-4 4-4M21 13v2a2 2 0 0 1-2 2H3"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
var VIDEOS=[
 {id:1,t:"Como fazer pão de queijo mineiro de verdade",ch:"Cozinha do Zé",v:482000,ago:"há 3 dias",d:754,h:28,c:"Receitas"},
 {id:2,t:"Meu primeiro jogo em HTML do zero",ch:"Código Aberto BR",v:128400,ago:"há 1 semana",d:1262,h:210,c:"Jogos"},
 {id:3,t:"Pescaria no amanhecer: tucunaré na isca artificial",ch:"Pesca Pro",v:931000,ago:"há 2 semanas",d:1491,h:150,c:"Pesca"},
 {id:4,t:"Construindo uma vila inteira em 30 minutos",ch:"Mundo de Blocos",v:2300000,ago:"há 1 mês",d:1834,h:120,c:"Jogos"},
 {id:5,t:"Sinal perdido: teoria completa do final",ch:"Sinal Perdido TV",v:57800,ago:"há 5 horas",d:926,h:275,c:"Jogos"},
 {id:6,t:"Beat de rua com panela e colher",ch:"Ritmo de Rua",v:1200000,ago:"há 4 dias",d:318,h:340,c:"Música"},
 {id:7,t:"Montando um PC gamer barato em 2026",ch:"Lab Caseiro",v:645000,ago:"há 6 dias",d:1105,h:190,c:"Tecnologia"},
 {id:8,t:"Trilha da Pedra do Baú ao nascer do sol",ch:"Trilhas BR",v:89300,ago:"há 2 dias",d:683,h:95,c:"Viagem"}
];
var SHORTS=[
 {id:1,u:"@ritmoderua",p:"Esse som saiu de uma lata. #beat",m:"som original",h:330,l:84200,cm:932},
 {id:2,u:"@cozinhadoze",p:"Brigadeiro em 1 minuto, sem erro",m:"Cozinha do Zé",h:25,l:210500,cm:2210},
 {id:3,u:"@pescapro",p:"Olha esse tucunaré saindo da água",m:"som ambiente",h:150,l:65100,cm:410},
 {id:4,u:"@mundodeblocos",p:"Casa na árvore em 20 segundos",m:"trilha 8-bit",h:120,l:152000,cm:1340},
 {id:5,u:"@trilhasbr",p:"Vista do topo às 5h40 da manhã",m:"som ambiente",h:95,l:39800,cm:188}
];
var POSTS=[
 {id:1,n:"Cozinha do Zé",u:"@cozinhadoze",h:28,t:"Subi receita nova hoje. Pão de queijo com polvilho azedo, o segredo está na água quente.",ago:"2h",l:1840,r:210,c:96,img:true},
 {id:2,n:"Código Aberto BR",u:"@codigoaberto",h:210,t:"Dica rápida: um arquivo HTML único já roda um jogo 3D inteiro. Sem instalar nada.",ago:"5h",l:3120,r:540,c:187},
 {id:3,n:"Pesca Pro",u:"@pescapro",h:150,t:"Amanhã cedo tem live direto do rio. Quem vem?",ago:"8h",l:920,r:75,c:240},
 {id:4,n:"Ritmo de Rua",u:"@ritmoderua",h:340,t:"Qual objeto da sua casa vira instrumento? Responde aí que o próximo vídeo sai daqui.",ago:"1d",l:5410,r:880,c:1203,img:true},
 {id:5,n:"Trilhas BR",u:"@trilhasbr",h:95,t:"Nascer do sol visto da Pedra do Baú. Levem casaco, faz 8°C lá em cima.",ago:"2d",l:2210,r:305,c:134}
];
var COMMENTS=[
 {n:"Marina",h:320,t:"Fiz aqui e deu certo de primeira, obrigada!"},
 {n:"Carlos Eduardo",h:60,t:"Esse canal merece muito mais inscritos."},
 {n:"Bia",h:200,t:"Quem mais assistiu duas vezes seguidas?"}
];
var st={liked:{},subs:{},tab:"videos",cat:"Todos",q:""};
try{var raw=localStorage.getItem("vixion-state");if(raw){var o=JSON.parse(raw);st.liked=o.liked||{};st.subs=o.subs||{}}}catch(e){}
function save(){try{localStorage.setItem("vixion-state",JSON.stringify({liked:st.liked,subs:st.subs}))}catch(e){}}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){if(n>=1e6)return (n/1e6).toFixed(1).replace(".0","").replace(".",",")+" mi";if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(".0","").replace(".",",")+" mil";return String(n)}
function dur(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r}
function init(n){return n.replace("@","").trim().charAt(0).toUpperCase()}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},1800)}

/* vídeos */
var CATS=["Todos","Jogos","Receitas","Pesca","Música","Tecnologia","Viagem"];
function drawChips(){
  $("#chips").innerHTML=CATS.map(function(c){return '<button class="chip" data-cat="'+c+'" aria-pressed="'+(c===st.cat)+'">'+c+'</button>'}).join("");
}
function drawGrid(){
  var q=st.q.toLowerCase();
  var list=VIDEOS.filter(function(v){return (st.cat==="Todos"||v.c===st.cat)&&(!q||(v.t+" "+v.ch).toLowerCase().indexOf(q)>-1)});
  $("#grid").innerHTML=list.length?list.map(function(v){
    return '<button class="vid" data-vid="'+v.id+'" style="--h:'+v.h+'"><div class="thumb"><div class="art"></div><div class="t">'+esc(v.t.split(" ").slice(0,4).join(" "))+'</div><span class="dur">'+dur(v.d)+'</span></div>'+
    '<div class="meta"><div class="av">'+init(v.ch)+'</div><div class="minw"><h3>'+esc(v.t)+'</h3><div class="sub">'+esc(v.ch)+' · '+fmt(v.v)+' de views · '+v.ago+'</div></div></div></button>';
  }).join(""):'<div class="empty">Nenhum vídeo encontrado.</div>';
}

/* shorts */
function drawShorts(){
  $("#shorts").innerHTML=SHORTS.map(function(s){
    var on=st.liked["s"+s.id];
    return '<article class="short" data-s="'+s.id+'" style="--h:'+s.h+'"><div class="art"></div>'+
    '<button class="tap" data-tap aria-label="Pausar ou continuar"></button><div class="pauseflag"><span>'+ICON.play+'</span></div>'+
    '<div class="sinfo"><b>'+esc(s.u)+'</b><p>'+esc(s.p)+'</p><small>♪ '+esc(s.m)+'</small></div>'+
    '<div class="rail"><button class="'+(on?"liked":"")+'" data-slike="'+s.id+'"><span class="b">'+ICON.heart+'</span><span>'+fmt(s.l+(on?1:0))+'</span></button>'+
    '<button data-toast="Comentários chegam na próxima versão"><span class="b">'+ICON.chat+'</span><span>'+fmt(s.cm)+'</span></button>'+
    '<button data-toast="Link copiado"><span class="b">'+ICON.share+'</span><span>Enviar</span></button></div>'+
    '<div class="prog"><i></i></div></article>';
  }).join("");
}

/* posts */
function drawPosts(){
  $("#posts").innerHTML=POSTS.map(function(p){
    var on=st.liked["p"+p.id];
    return '<article class="post" style="--h:'+p.h+'"><div class="av">'+init(p.n)+'</div><div class="body"><div class="who"><b>'+esc(p.n)+'</b> <span>'+esc(p.u)+' · '+p.ago+'</span></div>'+
    '<p>'+esc(p.t)+'</p>'+(p.img?'<div class="pmini"><div class="art"></div></div>':'')+
    '<div class="acts"><button data-toast="Respostas chegam na próxima versão">'+ICON.chat+fmt(p.c)+'</button>'+
    '<button data-toast="Repostado">'+ICON.repost+fmt(p.r)+'</button>'+
    '<button class="'+(on?"liked":"")+'" data-plike="'+p.id+'">'+ICON.heart+fmt(p.l+(on?1:0))+'</button>'+
    '<button data-toast="Link copiado">'+ICON.share+'</button></div></div></article>';
  }).join("");
}

/* abas */
function go(tab,silent){
  st.tab=tab;
  ["videos","shorts","posts"].forEach(function(t){$("#v-"+t).hidden=t!==tab});
  document.querySelectorAll(".tab").forEach(function(b){if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(!silent){try{history.replaceState(null,"","#"+tab)}catch(e){location.hash=tab}}
  window.scrollTo(0,0);
}

/* player */
var timer=null;
function openVideo(id){
  var v=VIDEOS.filter(function(x){return x.id==id})[0];if(!v)return;
  var sub=st.subs[v.ch],on=st.liked["v"+v.id],cms=COMMENTS.slice();
  var sh=$("#sheet");
  sh.innerHTML='<div class="in" style="--h:'+v.h+'"><div class="player" id="pl"><div class="art"></div>'+
   '<button class="close" id="cl" aria-label="Fechar">'+ICON.x+'</button>'+
   '<div class="pbar"><button id="pp" aria-label="Pausar">'+ICON.pause+'</button><div class="track"><i id="pf"></i></div><span id="pt">0:00 / '+dur(v.d)+'</span></div></div>'+
   '<div class="sec"><h2>'+esc(v.t)+'</h2><div class="sub">'+fmt(v.v)+' de views · '+v.ago+'</div>'+
   '<div class="row2"><div class="av">'+init(v.ch)+'</div><div class="grow"><b>'+esc(v.ch)+'</b></div><button class="btn'+(sub?" on":"")+'" id="sb">'+(sub?"Inscrito":"Inscrever-se")+'</button></div>'+
   '<div class="row2"><button class="btn ghost" id="lk" style="display:flex;gap:6px;align-items:center">'+ICON.heart.replace('<svg','<svg width="18" height="18"')+'<span id="lkn">'+fmt(Math.round(v.v/40)+(on?1:0))+'</span></button>'+
   '<button class="btn ghost" data-toast="Link copiado">Compartilhar</button></div>'+
   '<b>Comentários</b><div id="cms"></div>'+
   '<form class="cin" id="cf"><input id="ci" placeholder="Adicionar comentário" aria-label="Comentário" maxlength="200"><button class="btn" type="submit">Enviar</button></form></div></div>';
  sh.hidden=false;sh.scrollTop=0;document.body.style.overflow="hidden";
  function cdraw(){$("#cms",sh).innerHTML=cms.map(function(c){return '<div class="cm" style="--h:'+c.h+'"><div class="av">'+init(c.n)+'</div><div class="minw"><div class="sub">'+esc(c.n)+'</div><p>'+esc(c.t)+'</p></div></div>'}).join("")}
  cdraw();
  var cur=0,playing=true;
  clearInterval(timer);
  timer=setInterval(function(){
    if(!playing)return;cur=Math.min(v.d,cur+1);
    $("#pf",sh).style.width=(cur/v.d*100)+"%";$("#pt",sh).textContent=dur(cur)+" / "+dur(v.d);
    if(cur>=v.d){playing=false}
  },1000);
  function setPlay(p){playing=p;$("#pl",sh).classList.toggle("paused",!p);$("#pp",sh).innerHTML=p?ICON.pause:ICON.play;$("#pp",sh).setAttribute("aria-label",p?"Pausar":"Reproduzir")}
  $("#pp",sh).onclick=function(){setPlay(!playing)};
  $("#pl",sh).onclick=function(e){if(e.target.closest("button"))return;setPlay(!playing)};
  $("#cl",sh).onclick=closeVideo;
  $("#sb",sh).onclick=function(){st.subs[v.ch]=!st.subs[v.ch];save();this.textContent=st.subs[v.ch]?"Inscrito":"Inscrever-se";this.classList.toggle("on",!!st.subs[v.ch])};
  $("#lk",sh).onclick=function(){st.liked["v"+v.id]=!st.liked["v"+v.id];save();$("#lkn",sh).textContent=fmt(Math.round(v.v/40)+(st.liked["v"+v.id]?1:0))};
  $("#cf",sh).onsubmit=function(e){e.preventDefault();var i=$("#ci",sh),t=i.value.trim();if(!t)return;cms.unshift({n:"Você",h:180,t:t});i.value="";cdraw()};
}
function closeVideo(){clearInterval(timer);$("#sheet").hidden=true;$("#sheet").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#sheet").hidden)closeVideo()});

/* eventos */
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.cat){st.cat=t.dataset.cat;drawChips();drawGrid();return}
  if(t.dataset.vid){openVideo(t.dataset.vid);return}
  if(t.dataset.slike){var k="s"+t.dataset.slike;st.liked[k]=!st.liked[k];save();drawShorts();return}
  if(t.dataset.plike){var k2="p"+t.dataset.plike;st.liked[k2]=!st.liked[k2];save();drawPosts();return}
  if(t.dataset.toast){toast(t.dataset.toast);return}
  if(t.hasAttribute("data-tap")){t.closest(".short").classList.toggle("paused");return}
});
$("#q").addEventListener("input",function(){st.q=this.value;if(st.tab!=="videos")go("videos");drawGrid()});
$("#theme").addEventListener("click",function(){
  var r=document.documentElement,cur=r.getAttribute("data-theme");
  if(!cur)cur=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
});
$("#plus").addEventListener("click",function(){go("posts");setTimeout(function(){$("#ptxt").focus()},50)});
var pt=$("#ptxt"),pb=$("#pbtn"),cn=$("#cnt");
pt.addEventListener("input",function(){
  var left=280-pt.value.length;cn.textContent=left;cn.classList.toggle("over",left<0);
  pb.disabled=!pt.value.trim()||left<0;
});
pb.addEventListener("click",function(){
  var t=pt.value.trim();if(!t||t.length>280)return;
  POSTS.unshift({id:Date.now(),n:"Você",u:"@voce",h:180,t:t,ago:"agora",l:0,r:0,c:0});
  pt.value="";cn.textContent="280";pb.disabled=true;drawPosts();toast("Post publicado");
});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(["videos","shorts","posts"].indexOf(h)>-1)go(h,true)});

drawChips();drawGrid();drawShorts();drawPosts();
var h0=location.hash.slice(1);go(["videos","shorts","posts"].indexOf(h0)>-1?h0:"videos",true);
})();
</script>
